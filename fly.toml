# Public demo on Fly.io. First time:
#   fly launch --no-deploy --copy-config
#   fly volumes create photostack_data --size 1
#   fly deploy
app = "photostack-demo"
primary_region = "sin"

[build]

[env]
  DEMO_MODE = "true"

[[mounts]]
  source = "photostack_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
