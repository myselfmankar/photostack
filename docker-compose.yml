# Run PhotoStack locally: docker compose up --build, then open http://localhost:8000
services:
  photostack:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - photostack_data:/data  # database + uploads survive restarts
    environment:
      DEMO_MODE: "false"
      # GEMINI_API_KEY: ""  # optional AI tagging (image includes no AI extra by default)

volumes:
  photostack_data:
